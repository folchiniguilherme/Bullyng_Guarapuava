<header>
  <div class="top-bar">
    <div class="logo">
      <a href="index.html" class="logo-link">
        <span class="logo-emoji">👐</span>
        <span class="logo-text">Ajuda Guarapuava</span>
      </a>
    </div>
    
    <div class="top-bar-actions">
      <div class="accessibility-wrapper">
        <button id="btn-toggle-accessibility" class="btn-acc-toggle">🚹 Acessibilidade ▾</button>
        <div id="accessibility-menu" class="accessibility-dropdown hidden">
          <button id="btn-font-increase">A+ Aumentar</button>
          <button id="btn-font-decrease">A- Diminuir</button>
          <button id="btn-dark-mode">🌙 Modo Escuro</button>
          <button id="btn-high-contrast">👁️ Alto Contraste</button>
        </div>
      </div>

      <div class="login-wrapper">
        <button id="btn-toggle-login" class="btn-login-toggle">🔐 Login Seed ▾</button>
        <div id="login-dropdown" class="login-dropdown-menu hidden">
          <h4>Acesso Seed PR</h4>
          <p class="login-subtext">Use sua conta <code>@escola.pr.gov.br</code></p>
          <form id="form-login-seed">
            <div class="role-selector">
              <label class="role-option">
                <input type="radio" name="tipo_usuario" value="aluno" checked>
                <span class="role-box">🧑 Aluno</span>
              </label>
              <label class="role-option">
                <input type="radio" name="tipo_usuario" value="professor">
                <span class="role-box">👩‍🎓 Prof.</span>
              </label>
            </div>
            <input type="email" id="email-seed" placeholder="seu.nome@escola.pr.gov.br" required>
            <input type="password" id="senha-seed" placeholder="••••••••" required>
            <button type="submit" class="btn-login-submit">Entrar</button>
          </form>
          <div id="login-feedback" class="hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="main-nav">

    </ul>
  </nav>
</header>
