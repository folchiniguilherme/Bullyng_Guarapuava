<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ajuda Guarapuava - Login Seed PR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="logo">
        <a href="index.html">
          <img src="image_956a00.png" alt="Logo Portal Ajuda Guarapuava" class="site-logo">
        </a>
      </div>
      
      <div class="accessibility-wrapper">
        <button id="btn-toggle-accessibility" class="btn-acc-toggle">♿ Acessibilidade ▾</button>
        <div id="accessibility-menu" class="accessibility-dropdown hidden">
          <button id="btn-font-increase" title="Aumentar Fonte">A+ Aumentar</button>
          <button id="btn-font-decrease" title="Diminuir Fonte">A- Diminuir</button>
          <button id="btn-dark-mode" title="Alternar Modo Escuro">🌙 Modo Escuro</button>
          <button id="btn-high-contrast" title="Alternar Alto Contraste">👁️ Alto Contraste</button>
        </div>
      </div>
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="denuncia.html">Portal de Escuta</a></li>
        <li><a href="teste.html">Quiz Interativo</a></li>
        <li><a href="contatos.html">Contatos & Ajuda</a></li>
        <li><a href="login.html" class="active nav-login">🔐 Login Seed</a></li>
      </ul>
    </nav>
  </header>

  <main class="container login-container-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>Acesso Institucional Seed PR</h2>
        <p>Utilize sua conta institucional <code>@escola.pr.gov.br</code> para entrar.</p>
      </div>

      <form id="form-login-seed">
        <div class="role-selector">
          <label class="role-option">
            <input type="radio" name="tipo_usuario" value="aluno" checked>
            <span class="role-box">🧑 Aluno</span>
          </label>
          <label class="role-option">
            <input type="radio" name="tipo_usuario" value="professor">
            <span class="role-box">👩‍🎓 Professor</span>
          </label>
        </div>

        <div class="form-group">
          <label for="email-seed">E-mail da Escola (@escola.pr.gov.br):</label>
          <input type="email" id="email-seed" placeholder="seu.nome@escola.pr.gov.br" required>
        </div>

        <div class="form-group">
          <label for="senha-seed">Senha:</label>
          <input type="password" id="senha-seed" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-google-login">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo" class="google-icon">
          Entrar com Conta Google Escola
        </button>
      </form>

      <div id="login-feedback" class="hidden"></div>
    </div>
  </main>

  <button id="btn-back-to-top" title="Voltar ao topo">↑ Topo</button>

  <footer>
    <p>Projeto Idealizado e Desenvolvido por <strong>Guilherme L. Folchini</strong> &copy; 2026</p>
    <p class="powered-tag"><small>Powered by GitHub & Gemini</small></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
